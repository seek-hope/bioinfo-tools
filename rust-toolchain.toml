# Primary Rust toolchain.
#
# The repository builds with the latest stable release (1.99.1) while keeping
# the declared MSRV at 1.91 for users who cannot upgrade yet. The MSRV floor is
# set by noodles 0.118.0 and is declared in [workspace.package] in Cargo.toml;
# this file is the primary development/build pin, not the minimum.
#
# The exact patch is pinned so the compiler (and emitted code) is reproducible.
# `components` are only what the gates need: rustfmt and clippy.
#
# Updating this file is deliberate: bump it together with any MSRV decision,
# re-run the reproducible-build/cross/container checks, and update
# docs/EVIDENCE-PACKAGING.md.
[toolchain]
channel = "1.99.1"
components = ["rustfmt", "clippy"]
profile = "minimal"

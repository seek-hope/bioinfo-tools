# Oracle environment for the UMI-tools differential suites.
#
# Create a local prefix (do not commit it):
#   conda env create -f tests/ci/env.yml -p tests/ci/env
#   bash tests/oracle/run_exact.sh
#
# The scripts also accept UMI_TOOLS_ORACLE_PATH or an active CONDA_PREFIX.
name: umitools-1.1.6
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12.14
  - umi_tools=1.1.6
  - samtools=1.24
  - numpy=2.5.3
  - pysam=0.24.1

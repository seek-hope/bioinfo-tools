name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: build Linux x86_64 release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libbz2-dev liblzma-dev zlib1g-dev libclang-dev
      - name: Build
        run: cargo build --release --locked
      - name: Strip binary
        run: strip --strip-unneeded target/release/rust-umitools
      - name: Package
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          name="rust-umitools-${target}"
          mkdir -p "dist/${name}"
          cp target/release/rust-umitools "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.tar.gz
            dist/*.sha256
            install.sh
          generate_release_notes: true
      - name: Publish to public distribution
        env:
          GH_TOKEN: ${{ secrets.DIST_GITHUB_TOKEN }}
          DIST_REPO: seek-hope/rust-umitools-dist
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          tarball="dist/rust-umitools-x86_64-unknown-linux-gnu.tar.gz"
          checksum="${tarball}.sha256"
          if gh release view "$tag" --repo "$DIST_REPO" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$DIST_REPO"               "$tarball" "$checksum" install.sh --clobber
          else
            gh release create "$tag" --repo "$DIST_REPO"               --title "rust-umitools ${tag#v}"               --notes "Prebuilt Linux x86_64 binary for rust-umitools ${tag#v}. Verify the SHA256 checksum before installing."               "$tarball" "$checksum" install.sh
          fi

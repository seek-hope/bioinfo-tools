name: ci

on:
  push:
  pull_request:

jobs:
  test:
    name: fmt, clippy, test (x86_64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - name: Install HTSlib and samtools
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhts-dev samtools zlib1g-dev
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test --release
      - run: cargo build --release

  msrv:
    name: minimum supported Rust 1.88
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      - name: Install HTSlib
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libhts-dev zlib1g-dev
      - run: cargo build --release

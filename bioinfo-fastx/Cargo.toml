[package]
name = "bioinfo-fastx"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Streaming FASTQ/FASTA reading and writing with strict and lenient parsing, compression detection and BGZF"
license = "MIT"
readme = "README.md"
repository = "https://github.com/seek-hope/bioinfo-tools"
keywords = ["bioinformatics", "fastq", "fasta", "gzip", "bgzf"]
categories = ["science::bioinformatics", "parser-implementations"]

# Dependencies are the compression backends the crate needs. `xz2` is built
# with its `static` feature so the bundled xz sources are used; this is the
# feature form of the previous direct `lzma-sys` pin. `crc32fast` is required by
# the BGZF writer, which must compute the same CRC32 as every other BGZF
# implementation.
[dependencies]
bzip2 = "0.6.1"
crc32fast = "1"
flate2 = "1"
xz2 = { version = "0.1.7", features = ["static"] }
zstd = "0.13.3"

[lib]
name = "bioinfo_fastx"
path = "src/lib.rs"

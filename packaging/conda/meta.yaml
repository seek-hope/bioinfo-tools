# Conda recipe draft for rust-cutadapt.
#
# ## STATUS: DRAFT, NEVER BUILT OR LINTED
#
# `conda-build` is not installed in the environment where this was written, so this
# recipe has not been rendered, linted or built. It is a draft that states what a
# real recipe would need, not a verified recipe. See
# docs/EVIDENCE-PACKAGING.md.
#
# ## The build approach, and why it is written this way
#
# `rust-cutadapt` is a member of a Cargo **workspace** and uses **path
# dependencies** on `bioinfo-common` and `bioinfo-fastx`. That has two
# consequences a real recipe must respect:
#
#   1. A published crates.io release would not be enough to build it: there are no
#      published `bioinfo-common`/`bioinfo-fastx` crates. The sdist must be the
#      whole workspace.
#   2. `cargo install --path rust-cutadapt` alone fails to resolve the path
#      dependencies unless the sibling directories are present, so the recipe must
#      ship the whole tree.
#
# The `build:` block below therefore assumes an sdist containing the workspace root,
# and it is deliberately explicit about `--locked` so the dependency set matches the
# committed `Cargo.lock`.
#
# ## Toolchain policy: MSRV lower bound, not the primary pin
#
# The repository has two distinct Rust numbers:
#
#   * a **primary development pin** of 1.99.1 in `rust-toolchain.toml`, which is
#     what the workspace is built and verified with; and
#   * a **declared MSRV of 1.91** in `[workspace.package] rust-version`.
#
# Conda packaging is intentionally decoupled from the first. It only needs a
# compiler that satisfies the MSRV, so this recipe requires `rust >=1.91` and lets
# the solver choose. That is the right shape: a conda package should not be forced
# to rebuild merely because the primary development pin moves, and a user
# installing from conda is entitled to any compiler that honours the declared floor.
#
# Two consequences that are stated rather than hidden:
#
#   1. **`rust-toolchain.toml` is ignored by conda builds.** That file is a rustup
#      feature; conda-forge's `rust` installs rustc and cargo directly under
#      `$BUILD_PREFIX/bin`, so there is no rustup to read it. This is not a defect
#      to fix here -- the pin is a *development* concern, and the MSRV is what
#      governs a conda build.
#   2. **The conda binary is not byte-identical to the primary 1.99.1 build.** It
#      is compiled by whatever rustc the solver picks, so its bytes differ. That is
#      expected and acceptable: the conda package is required to *build and run
#      correctly*, not to reproduce the primary artifact. The reproducibility claim
#      in docs/EVIDENCE-PACKAGING.md covers the Rust build only, never conda.
#
# The version actually resolved by the solver, and the resulting package hash, are
# recorded in docs/EVIDENCE-PACKAGING.md for each build that was performed.

{% set name = "rust-cutadapt" %}
{% set version = "0.1.0" %}

package:
  name: {{ name }}
  version: {{ version }}

source:
  # The sdist must contain the WHOLE workspace: the crate uses path dependencies
  # on bioinfo-common and bioinfo-fastx, which are not published separately.
  #
  # `../..` and not `..`: this recipe lives at packaging/conda/meta.yaml, so `..`
  # resolves to packaging/, which contains no Cargo.toml. conda-build resolves
  # `path:` relative to the recipe directory.
  path: ../..

build:
  number: 0
  # The binary is the deliverable; no Python or R entry points.
  script:
    # --locked honours the committed Cargo.lock; --release matches the profile the
    # evidence records.
    - cargo build --release --locked -p rust-cutadapt
    - mkdir -p $PREFIX/bin
    - install -m 0755 target/release/rust-cutadapt $PREFIX/bin/rust-cutadapt
  # Skip on platforms where the pinned toolchain is unavailable; a real recipe
  # should narrow this to what CI actually validates.
  skip: true  # [win]

requirements:
  build:
    # Rust toolchain: a LOWER BOUND, not an exact pin.
    #
    # Conda packaging is independent of the repository's primary development
    # toolchain. It only needs a compiler that satisfies the *declared MSRV*
    # (`[workspace.package] rust-version = "1.91"` in Cargo.toml), so the
    # requirement is `>=1.91` and the solver picks.
    #
    # Deliberately NOT `rust 1.99.1` (the primary pin) and NOT `rust 1.99.0` (the
    # previous exact pin): either would tie the conda artifact to a specific
    # toolchain for no reason, and both would force a rebuild every time the
    # primary pin moves even though the MSRV did not.
    #
    # The conda-forge `rust` package ships BOTH rustc and cargo, so there is no
    # separate `cargo` package to require -- adding one makes the dependency solve
    # unsatisfiable ("cargo does not exist").
    #
    # `>=1.91` is satisfiable at the floor: conda-forge publishes rust 1.91.0 and
    # 1.91.1. What the solver actually chooses is recorded in
    # docs/EVIDENCE-PACKAGING.md rather than assumed here.
    - rust >=1.91
    # Native C compiler for zstd-sys and lzma-sys, which compile vendored C.
    - {{ compiler('c') }}
    - make
  host: []
  run:
    # The binary links dynamically against glibc/libgcc only; conda-forge's
    # __glibc run constraint covers this.
    - __glibc >=2.17

test:
  commands:
    # A version check plus one real trim, so the test would catch a broken binary
    # rather than only a missing file.
    - rust-cutadapt --version
    - printf '@r1\nACGTACGT\n+\nIIIIIIII\n' > test.fq
    - rust-cutadapt -a ACGT -o /dev/null test.fq

about:
  home: https://github.com/seek-hope/bioinfo-tools
  license: MIT
  summary: cutadapt 4.6-compatible adapter trimmer, implemented in Rust
  description: |
    Pure-Rust reimplementation of cutadapt 4.6's adapter-trimming subset, verified
    against cutadapt 4.6 by differential test. Part of the bioinfo-tools workspace.
  dev_url: https://github.com/seek-hope/bioinfo-tools

extra:
  recipe-maintainers:
    - seek-hope

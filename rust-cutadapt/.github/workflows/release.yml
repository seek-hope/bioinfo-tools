name: release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  linux-x86_64:
    name: build Linux x86_64 release
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build
        run: cargo build --release --locked
      - name: Strip binary
        run: strip --strip-unneeded target/release/rust-cutadapt
      - name: Package
        run: |
          set -euo pipefail
          target="x86_64-unknown-linux-gnu"
          name="rust-cutadapt-${target}"
          mkdir -p "dist/${name}"
          cp target/release/rust-cutadapt "dist/${name}/"
          cp README.md LICENSE "dist/${name}/"
          tar -C dist -czf "dist/${name}.tar.gz" "${name}"
          (cd dist && sha256sum "${name}.tar.gz" > "${name}.tar.gz.sha256")
      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: rust-cutadapt-${{ github.ref_name }}
          path: |
            dist/*.tar.gz
            dist/*.sha256
      # Publishing to the public distribution repository requires a
      # DIST_GITHUB_TOKEN secret with `repo` scope on seek-hope/rust-cutadapt-dist.
      # This workflow intentionally does not create a GitHub release in this
      # (source) repository: releases live only in the distribution repository.
      - name: Publish to public distribution
        env:
          GH_TOKEN: ${{ secrets.DIST_GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "DIST_GITHUB_TOKEN is not configured; skipping publication." >&2
            echo "The release artifacts are attached to this workflow run instead." >&2
            exit 0
          fi
          dist_repo="seek-hope/rust-cutadapt-dist"
          tag="${GITHUB_REF_NAME}"
          tarball="dist/rust-cutadapt-x86_64-unknown-linux-gnu.tar.gz"
          checksum="${tarball}.sha256"
          if gh release view "$tag" --repo "$dist_repo" >/dev/null 2>&1; then
            gh release upload "$tag" --repo "$dist_repo" \
              "$tarball" "$checksum" install.sh --clobber
          else
            gh release create "$tag" --repo "$dist_repo" \
              --title "rust-cutadapt ${tag#v}" \
              --notes "Prebuilt Linux x86_64 binary for rust-cutadapt ${tag#v}. Verify the SHA256 checksum before installing." \
              "$tarball" "$checksum" install.sh
          fi

# Oracle environment for tests/oracle/differential.py.
#
# Create a local prefix (do not commit it):
#   conda env create -f tests/ci/env.yml -p tests/ci/env
#   python3 tests/oracle/differential.py --matrix
#
# The harness also accepts CUTADAPT_ORACLE, an active CONDA_PREFIX, a
# .work/oracle-venv next to the repository, or cutadapt on PATH.
name: cutadapt-4.6
channels:
  - conda-forge
  - bioconda
dependencies:
  - python=3.12
  - cutadapt=4.6

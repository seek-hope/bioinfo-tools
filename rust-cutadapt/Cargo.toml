[package]
name = "rust-cutadapt"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Adapter trimming for FASTQ/FASTA reads with the documented cutadapt 4.6 command-line surface"
license = "MIT"
readme = "README.md"
repository = "https://github.com/seek-hope/bioinfo-tools"
keywords = ["bioinformatics", "fastq", "adapter", "trimming", "cutadapt"]
categories = ["science::bioinformatics", "command-line-utilities"]

[dependencies]
bioinfo-fastx = { path = "../bioinfo-fastx" }
bzip2 = "0.6.1"
clap = { version = "4", features = ["derive"] }
flate2 = "1"
xz2 = { version = "0.1.7", features = ["static"] }

# The release profile is defined once at the workspace root
# (../Cargo.toml); Cargo ignores member-level profiles.

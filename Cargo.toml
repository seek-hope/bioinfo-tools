[workspace]
resolver = "2"
members = [
    "bioinfo-common",
    "bioinfo-fastx",
    "rust-bam",
    "rust-cutadapt",
    "rust-fastqc",
    "rust-fx",
    "rust-umitools",
]

# Workspace MSRV: 1.91; primary toolchain: 1.99.1.
#
# The MSRV floor is set by `noodles` 0.118.0, which declares
# `rust-version = "1.91.0"` on itself and every sub-crate. The workspace's
# `rust-toolchain.toml` pins the latest stable (1.99.1) for development,
# packaging and CI; older compiler users keep the 1.91 floor.
[workspace.package]
rust-version = "1.91"

# One release profile for the whole workspace.
#
# Cargo refuses `lto` in a `[profile.release.package.*]` override (it is a
# whole-program setting), so the two members cannot keep different LTO modes
# once they share a workspace root:
#
#   rust-cutadapt  had lto = "thin"
#   rust-umitools  had lto = "fat"
#
# `fat` is kept because it is the stronger of the two and it leaves
# rust-umitools' build exactly as it was; rust-cutadapt only gains optimisation.
# The choice changes code generation, never observable behaviour:
# `tests/gate/m3.sh` proves byte-identical stdout, stderr, exit codes and
# output files for both binaries. Recorded as DR-6 in docs/EVIDENCE-W1-1.md.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1

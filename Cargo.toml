[workspace]
resolver = "2"
members = [
    "bioinfo-common",
    "bioinfo-fastx",
    "rust-bam",
    "rust-cutadapt",
    "rust-fastqc",
    "rust-fx",
    "rust-umitools",
]

# Workspace-wide MSRV: 1.91.
#
# This floor is set by `noodles` 0.118.0, which declares `rust-version = "1.91.0"`
# on itself and on every sub-crate (`noodles-bam`, `-sam`, `-bgzf`, `-csi`,
# `-core`). Cargo refuses to build a workspace member on a toolchain below a
# dependency's declared minimum, so keeping the previous 1.88 value while
# `rust-bam` depends on noodles would be a claim that cannot be honoured.
#
# The other five members are buildable on 1.88 today; a shared workspace can only
# declare one floor, so their effective minimum rises to 1.91 as a consequence.
# Verified: the whole suite (587 tests before rust-bam landed) passes under the
# 1.91.0 toolchain. Recorded as DR-W1-4-2 in docs/EVIDENCE-W1-4.md.
[workspace.package]
rust-version = "1.91"

# One release profile for the whole workspace.
#
# Cargo refuses `lto` in a `[profile.release.package.*]` override (it is a
# whole-program setting), so the two members cannot keep different LTO modes
# once they share a workspace root:
#
#   rust-cutadapt  had lto = "thin"
#   rust-umitools  had lto = "fat"
#
# `fat` is kept because it is the stronger of the two and it leaves
# rust-umitools' build exactly as it was; rust-cutadapt only gains optimisation.
# The choice changes code generation, never observable behaviour:
# `tests/gate/m3.sh` proves byte-identical stdout, stderr, exit codes and
# output files for both binaries. Recorded as DR-6 in docs/EVIDENCE-W1-1.md.
[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
